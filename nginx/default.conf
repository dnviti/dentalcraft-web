# Static server for the DentalCraft site (nginx-unprivileged, port 8080).
# TLS and the public host name belong to the reverse proxy in front. HSTS is sent from here
# (security-headers.conf), because the proxy does not set it.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;      # relative Location headers: safe behind any proxy or port
    charset utf-8;

    # Only text is compressed on the fly; packages, archives and OSTree objects are already
    # compressed and are sent as they are (sendfile), which keeps memory flat.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/vtt text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml image/x-icon;

    # nginx's default mime.types has no WebVTT; browsers refuse captions without text/vtt.
    # A `types` block at server level replaces the inherited one, so include the defaults again.
    # (deb, rpm, msi and exe are in the defaults.)
    include /etc/nginx/mime.types;
    types {
        text/vtt vtt;
        application/manifest+json webmanifest;
        application/gzip gz;
        application/vnd.flatpak.ref flatpakref;
        application/vnd.flatpak.repo flatpakrepo;
        application/vnd.appimage appimage;
        application/pgp-keys gpg;
        application/pgp-signature asc;
        text/plain minisig pub list repo;
    }

    error_page 404 /404.html;

    # Health check for the orchestrator. Not cached, not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Content-hashed build output (CSS, JS, fonts, images, brand SVG): cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Video, captions and poster: stable names, so a week; byte ranges are served by default.
    location /media/ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Release files (see README, Downloads): the file names carry the version, so they never change.
    # Served as attachments, kept out of search results.
    location /download/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Disposition "attachment" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Update manifest checked by the app at startup, and its minisign signature: always revalidate.
    location /update/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Public signing keys.
    location /keys/ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Package files of the APT and RPM repositories: the same files as /download/ (one copy in the image).
    location ~ ^/linux/apt/pool/(dentalcraft_[^/]+\.deb)$ {
        alias /usr/share/nginx/html/download/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ~ ^/linux/rpm/(dentalcraft-[^/]+\.rpm)$ {
        alias /usr/share/nginx/html/download/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # OSTree objects and deltas are content-addressed: cache for a year.
    location ^~ /linux/flatpak/objects/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
    location ^~ /linux/flatpak/deltas/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Repository metadata (InRelease, repomd.xml, OSTree summary and refs) and the one-time setup
    # files (.list, .repo, .flatpakrepo, .flatpakref): they change with every release, so revalidate.
    location /linux/ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The app links to https://dentalcraft.app/releases.
    location = /releases {
        include /etc/nginx/snippets/security-headers.conf;
        return 302 /en/download/;
    }

    # RFC 9116 security contact, generated by the build (dot-directories are served like any other path).
    location = /.well-known/security.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Root files with stable names.
    location ~* ^/(favicon\.ico|favicon\.svg|apple-touch-icon-180\.png|android-chrome-(192|512)\.png|site\.webmanifest|robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # HTML: short cache, always revalidate.
    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
