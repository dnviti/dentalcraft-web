name: image

# Builds the site image and pushes it to ghcr:
#   ghcr.io/<owner>/dentalcraft-web:latest
#   ghcr.io/<owner>/dentalcraft-web:sha-<short>
#   ghcr.io/<owner>/dentalcraft-web:<version>      (only on a v* tag; "v1.2.3" -> "1.2.3")
# Runs on every push to main, on v* tags, and by hand (workflow_dispatch).
# Same runner and action versions as dentalcraft-server's image workflow.
# The Node build happens inside the image build, so the runner needs no toolchain.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: golgari-dev # ARC scale set with Docker-in-Docker
    steps:
      - uses: actions/checkout@v7
      - name: Derive the image tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/dentalcraft-web"
          tags="$image:latest"$'\n'"$image:sha-${GITHUB_SHA::7}"
          if [ "$REF_TYPE" = "tag" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "tag must look like v1.2.3, got: $REF_NAME" >&2
              exit 1
            fi
            tags="$tags"$'\n'"$image:${REF_NAME#v}"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version || github.sha }}
