name: image

# Builds the site image and pushes it to ghcr:
#   ghcr.io/<owner>/dentalcraft-web:latest
#   ghcr.io/<owner>/dentalcraft-web:sha-<short>
#   ghcr.io/<owner>/dentalcraft-web:<version>      (only on a v* tag; "v1.2.3" -> "1.2.3")
# Runs on every push to main, on v* tags, and by hand (workflow_dispatch).
# Same runner and action versions as dentalcraft-server's image workflow.
# The Node build happens inside the image build, so the runner needs no toolchain.
# The app archives for /download/ are fetched first with the APP_RELEASE_TOKEN secret (see README, Downloads).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: golgari-dev # ARC scale set with Docker-in-Docker
    steps:
      - uses: actions/checkout@v7
      # The site serves the app archives from /download/. They live in the private app release
      # and are baked into the image: the build checks them against content/site.data.json.
      - name: Ensure the gh CLI
        run: |
          command -v gh >/dev/null && exit 0
          case "$(uname -m)" in
            x86_64) arch=amd64; sum=4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d ;;
            aarch64|arm64) arch=arm64; sum=ee32df2323c8847f5fac6cb6b4b69ca75828e9329a8f22f677021f7b3306ce63 ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          ver=2.103.3
          curl -fsSL -o gh.tar.gz "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_${arch}.tar.gz"
          echo "$sum  gh.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" gh-dist
          tar -xzf gh.tar.gz -C gh-dist --strip-components=1
          cp gh-dist/bin/gh "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf gh.tar.gz gh-dist
      - name: Fetch the app downloads
        env:
          GH_TOKEN: ${{ secrets.APP_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "secret APP_RELEASE_TOKEN is empty: add a fine-grained token with read access to Contents of the app repo" >&2
            exit 1
          fi
          # The runner has no guaranteed node or jq: read the two values with sed (the file is pretty-printed JSON).
          repo=$(sed -n 's/^ *"repo": *"\([^"]*\)".*/\1/p' content/site.data.json | head -n 1)
          tag=$(sed -n 's/^ *"tag": *"\(v[^"]*\)".*/\1/p' content/site.data.json | head -n 1)
          printf '%s' "$repo" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' || { echo "bad release.repo in content/site.data.json: '$repo'" >&2; exit 1; }
          printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "bad release.tag in content/site.data.json: '$tag'" >&2; exit 1; }
          mkdir -p downloads
          gh release download "$tag" -R "$repo" -p 'dentalcraft_*' -D downloads
          ls -l downloads
          sha256sum downloads/*
      - name: Derive the image tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/dentalcraft-web"
          tags="$image:latest"$'\n'"$image:sha-${GITHUB_SHA::7}"
          if [ "$REF_TYPE" = "tag" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "tag must look like v1.2.3, got: $REF_NAME" >&2
              exit 1
            fi
            tags="$tags"$'\n'"$image:${REF_NAME#v}"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version || github.sha }}
